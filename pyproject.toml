[project]
name = "recruiter-mail-sender"
version = "0.1.0"
description = "Send one message to a list of addresses from your own mail account, with an app password or a Gmail token"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mailsend = "mailsender.cli:main"

[tool.setuptools]
packages = ["mailsender"]

[tool.setuptools.package-data]
mailsender = ["ui.html"]
